databaseChangeLog:
  - changeSet:
      id: 001-create-health-record-table
      author: e-health-insurance
      changes:
        - createTable:
            tableName: health_record
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone

  - changeSet:
      id: 002-create-medical-entry-table
      author: e-health-insurance
      changes:
        - createTable:
            tableName: medical_entry
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: health_record_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_medical_entry_health_record
                    references: health_record(id)
              - column:
                  name: entry_type
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: diagnosis_code
                  type: varchar(50)
              - column:
                  name: description
                  type: text
              - column:
                  name: provider_name
                  type: varchar(200)
              - column:
                  name: entry_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: medical_entry
            indexName: idx_medical_entry_health_record
            columns:
              - column:
                  name: health_record_id

  - changeSet:
      id: 003-create-prescription-table
      author: e-health-insurance
      changes:
        - createTable:
            tableName: prescription
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: health_record_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_prescription_health_record
                    references: health_record(id)
              - column:
                  name: medication_name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: dosage
                  type: varchar(100)
              - column:
                  name: frequency
                  type: varchar(100)
              - column:
                  name: prescribed_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: date
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: prescription
            indexName: idx_prescription_health_record
            columns:
              - column:
                  name: health_record_id

  - changeSet:
      id: 004-create-lab-result-table
      author: e-health-insurance
      changes:
        - createTable:
            tableName: lab_result
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: health_record_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_lab_result_health_record
                    references: health_record(id)
              - column:
                  name: test_name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: test_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: result_value
                  type: varchar(100)
              - column:
                  name: reference_range
                  type: varchar(100)
              - column:
                  name: unit
                  type: varchar(50)
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: lab_result
            indexName: idx_lab_result_health_record
            columns:
              - column:
                  name: health_record_id
