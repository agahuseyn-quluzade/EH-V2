databaseChangeLog:
  - changeSet:
      id: 003-health-record-production-indexes
      author: e-health-insurance
      changes:
        - createIndex:
            tableName: medical_entry
            indexName: idx_medical_entry_record_date
            columns:
              - column:
                  name: health_record_id
              - column:
                  name: entry_date
        - createIndex:
            tableName: prescription
            indexName: idx_prescription_record_date
            columns:
              - column:
                  name: health_record_id
              - column:
                  name: prescribed_date
        - createIndex:
            tableName: prescription
            indexName: idx_prescription_record_status
            columns:
              - column:
                  name: health_record_id
              - column:
                  name: status
        - createIndex:
            tableName: lab_result
            indexName: idx_lab_result_record_date
            columns:
              - column:
                  name: health_record_id
              - column:
                  name: test_date
        - createIndex:
            tableName: lab_result
            indexName: idx_lab_result_record_status
            columns:
              - column:
                  name: health_record_id
              - column:
                  name: status
