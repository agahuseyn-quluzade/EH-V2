spring:
  application:
    name: e-health-insurance-health-record
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ehi_health_record}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: ${KAFKA_PRODUCER_RETRIES:10}
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}

server:
  port: ${SERVER_PORT:8086}

ehi:
  security:
    jwt:
      secret: ${JWT_SECRET}
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}
      send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:10000}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
      retry-delay-ms: ${OUTBOX_RETRY_DELAY_MS:30000}
      dlq-suffix: ${OUTBOX_DLQ_SUFFIX:.dlq}

jwt:
  secret: ${JWT_SECRET}

services:
  iam-url: ${IAM_SERVICE_URL:http://localhost:8081}

resilience4j:
  circuitbreaker:
    instances:
      iamService:
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        slidingWindowSize: 10
        minimumNumberOfCalls: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  info:
    env:
      enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
