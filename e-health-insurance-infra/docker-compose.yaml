name: e-health-insurance

services:
  # ──────── Infrastructure ────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ehi
      POSTGRES_PASSWORD: ehi
      POSTGRES_DB: ehi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehi"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the environment or .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    command:
      - "--redis.addr=redis://redis:6379"
      - "--redis.password=$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the environment or .env}
    depends_on:
      redis: { condition: service_healthy }

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TOPICS: >
        ${PAYMENT_INITIATED_TOPIC:-payment.initiated}
        ${PAYMENT_SUCCEEDED_TOPIC:-payment.succeeded}
        ${PAYMENT_FAILED_TOPIC:-payment.failed}
        ${PAYMENT_REFUNDED_TOPIC:-payment.refunded}
        ${POLICY_PURCHASE_REQUESTED_TOPIC:-policy.purchase.requested}
        ${POLICY_ACTIVATED_TOPIC:-policy.activated}
        ${POLICY_CANCELLED_TOPIC:-policy.cancelled}
        ${CLAIM_SUBMITTED_TOPIC:-claim.submitted}
        ${CLAIM_AI_SCORED_TOPIC:-claim.ai.scored}
        ${CLAIM_REVIEW_REQUIRED_TOPIC:-claim.review.required}
        ${CLAIM_APPROVED_TOPIC:-claim.approved}
        ${CLAIM_REJECTED_TOPIC:-claim.rejected}
        ${NOTIFICATION_EMAIL_REQUESTED_TOPIC:-notification.email.requested}
        ${HEALTH_RECORD_CREATED_TOPIC:-health-record.created}
        ${HEALTH_RECORD_UPDATED_TOPIC:-health-record.updated}
        ${AUDIT_EVENT_CREATED_TOPIC:-audit.event.created}
        ${PAYMENT_INITIATED_DLQ_TOPIC:-payment.initiated.dlq}
        ${PAYMENT_SUCCEEDED_DLQ_TOPIC:-payment.succeeded.dlq}
        ${PAYMENT_FAILED_DLQ_TOPIC:-payment.failed.dlq}
        ${PAYMENT_REFUNDED_DLQ_TOPIC:-payment.refunded.dlq}
        ${POLICY_PURCHASE_REQUESTED_DLQ_TOPIC:-policy.purchase.requested.dlq}
        ${POLICY_ACTIVATED_DLQ_TOPIC:-policy.activated.dlq}
        ${POLICY_CANCELLED_DLQ_TOPIC:-policy.cancelled.dlq}
        ${CLAIM_SUBMITTED_DLQ_TOPIC:-claim.submitted.dlq}
        ${CLAIM_AI_SCORED_DLQ_TOPIC:-claim.ai.scored.dlq}
        ${CLAIM_REVIEW_REQUIRED_DLQ_TOPIC:-claim.review.required.dlq}
        ${CLAIM_APPROVED_DLQ_TOPIC:-claim.approved.dlq}
        ${CLAIM_REJECTED_DLQ_TOPIC:-claim.rejected.dlq}
        ${NOTIFICATION_EMAIL_REQUESTED_DLQ_TOPIC:-notification.email.requested.dlq}
        ${HEALTH_RECORD_CREATED_DLQ_TOPIC:-health-record.created.dlq}
        ${HEALTH_RECORD_UPDATED_DLQ_TOPIC:-health-record.updated.dlq}
        ${AUDIT_EVENT_CREATED_DLQ_TOPIC:-audit.event.created.dlq}
    command: >
      bash -ec '
        echo "Waiting for Kafka at $$KAFKA_BOOTSTRAP_SERVERS";
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" --list >/dev/null 2>&1; do
          sleep 2;
        done;
        for topic in $$KAFKA_TOPICS; do
          echo "Ensuring Kafka topic: $$topic";
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" --create --if-not-exists --topic "$$topic" --partitions "$$KAFKA_TOPIC_PARTITIONS" --replication-factor "$$KAFKA_TOPIC_REPLICATION_FACTOR";
        done;
      '
    restart: "no"

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      kafka: { condition: service_healthy }

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["dev-tools"]
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka: { condition: service_healthy }

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./observability/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki, jaeger, prometheus]

  # ──────── Application services ────────

  gateway:
    build:
      context: ..
      dockerfile: e-health-insurance-gw/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      IAM_URL: http://iam:8081
      POLICY_URL: http://policy:8082
      CLAIM_URL: http://claim:8083
      AI_URL: http://ai:8084
      NOTIFICATION_URL: http://notification:8085
      PAYMENT_URL: http://payment:8087
      HEALTH_RECORD_URL: http://health-record:8086
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (provide a base64-encoded HMAC key in .env)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the environment or .env}
      RATE_LIMIT_LOGIN_REPLENISH_RATE: ${RATE_LIMIT_LOGIN_REPLENISH_RATE:-5}
      RATE_LIMIT_LOGIN_BURST_CAPACITY: ${RATE_LIMIT_LOGIN_BURST_CAPACITY:-10}
      RATE_LIMIT_REGISTER_REPLENISH_RATE: ${RATE_LIMIT_REGISTER_REPLENISH_RATE:-2}
      RATE_LIMIT_REGISTER_BURST_CAPACITY: ${RATE_LIMIT_REGISTER_BURST_CAPACITY:-5}
      RATE_LIMIT_PASSWORD_RESET_REPLENISH_RATE: ${RATE_LIMIT_PASSWORD_RESET_REPLENISH_RATE:-2}
      RATE_LIMIT_PASSWORD_RESET_BURST_CAPACITY: ${RATE_LIMIT_PASSWORD_RESET_BURST_CAPACITY:-4}
      RATE_LIMIT_PAYMENT_REPLENISH_RATE: ${RATE_LIMIT_PAYMENT_REPLENISH_RATE:-5}
      RATE_LIMIT_PAYMENT_BURST_CAPACITY: ${RATE_LIMIT_PAYMENT_BURST_CAPACITY:-10}
      RATE_LIMIT_CLAIM_SUBMIT_REPLENISH_RATE: ${RATE_LIMIT_CLAIM_SUBMIT_REPLENISH_RATE:-3}
      RATE_LIMIT_CLAIM_SUBMIT_BURST_CAPACITY: ${RATE_LIMIT_CLAIM_SUBMIT_BURST_CAPACITY:-6}
      RATE_LIMIT_DEFAULT_REPLENISH_RATE: ${RATE_LIMIT_DEFAULT_REPLENISH_RATE:-50}
      RATE_LIMIT_DEFAULT_BURST_CAPACITY: ${RATE_LIMIT_DEFAULT_BURST_CAPACITY:-100}
      LOG_FORMAT: ecs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      redis: { condition: service_healthy }
      iam: { condition: service_healthy }
      policy: { condition: service_healthy }
      claim: { condition: service_healthy }
      ai: { condition: service_healthy }
      notification: { condition: service_healthy }
      payment: { condition: service_healthy }
      health-record: { condition: service_healthy }

  iam:
    build:
      context: ..
      dockerfile: e-health-insurance-iam/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehi_iam
      SPRING_DATASOURCE_USERNAME: ehi
      SPRING_DATASOURCE_PASSWORD: ehi
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (provide a base64-encoded HMAC key in .env)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the environment or .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IAM_EVENTS_ENABLED: ${IAM_EVENTS_ENABLED:-true}
      NOTIFICATION_EMAIL_REQUESTED_TOPIC: ${NOTIFICATION_EMAIL_REQUESTED_TOPIC:-notification.email.requested}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-15m}
      EMAIL_VERIFICATION_TOKEN_TTL: ${EMAIL_VERIFICATION_TOKEN_TTL:-24h}
      PASSWORD_RESET_LINK_URL: ${PASSWORD_RESET_LINK_URL:-http://localhost:5173/reset-password}
      EMAIL_VERIFICATION_LINK_URL: ${EMAIL_VERIFICATION_LINK_URL:-http://localhost:5173/verify-email}
      LOG_FORMAT: ecs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  policy:
    build:
      context: ..
      dockerfile: e-health-insurance-policy/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehi_policy
      SPRING_DATASOURCE_USERNAME: ehi
      SPRING_DATASOURCE_PASSWORD: ehi
      DB_URL: jdbc:postgresql://postgres:5432/ehi_policy
      DB_USERNAME: ehi
      DB_PASSWORD: ehi
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (provide a base64-encoded HMAC key in .env)}
      IAM_VALIDATION_ENABLED: "true"
      IAM_SERVICE_URL: http://iam:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      POLICY_PAYMENT_EVENTS_ENABLED: ${POLICY_PAYMENT_EVENTS_ENABLED:-true}
      POLICY_PAYMENT_CONSUMER_GROUP: ${POLICY_PAYMENT_CONSUMER_GROUP:-policy-service-payment-events}
      PAYMENT_INITIATED_TOPIC: ${PAYMENT_INITIATED_TOPIC:-payment.initiated}
      PAYMENT_SUCCEEDED_TOPIC: ${PAYMENT_SUCCEEDED_TOPIC:-payment.succeeded}
      PAYMENT_FAILED_TOPIC: ${PAYMENT_FAILED_TOPIC:-payment.failed}
      LOG_FORMAT: ecs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      iam: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  claim:
    build:
      context: ..
      dockerfile: e-health-insurance-claim/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehi_claim
      SPRING_DATASOURCE_USERNAME: ehi
      SPRING_DATASOURCE_PASSWORD: ehi
      DB_URL: jdbc:postgresql://postgres:5432/ehi_claim
      DB_USERNAME: ehi
      DB_PASSWORD: ehi
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (provide a base64-encoded HMAC key in .env)}
      POLICY_SERVICE_URL: http://policy:8082
      AI_SERVICE_URL: http://ai:8084
      NOTIFICATION_SERVICE_URL: http://notification:8085
      IAM_SERVICE_URL: http://iam:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      CLAIM_EVENTS_ENABLED: ${CLAIM_EVENTS_ENABLED:-true}
      CLAIM_AI_SCORED_TOPIC: ${CLAIM_AI_SCORED_TOPIC:-claim.ai.scored}
      CLAIM_AI_SCORE_CONSUMER_GROUP: ${CLAIM_AI_SCORE_CONSUMER_GROUP:-claim-service-ai-score}
      EVIDENCE_STORAGE_PATH: /var/ehi/evidence
      LOG_FORMAT: ecs
    volumes:
      - evidence-data:/var/ehi/evidence
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      iam: { condition: service_healthy }
      policy: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  payment:
    build:
      context: ..
      dockerfile: e-health-insurance-payment/Dockerfile
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehi_payment
      SPRING_DATASOURCE_USERNAME: ehi
      SPRING_DATASOURCE_PASSWORD: ehi
      DB_URL: jdbc:postgresql://postgres:5432/ehi_payment
      DB_USERNAME: ehi
      DB_PASSWORD: ehi
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the environment or .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      PAYMENT_IDEMPOTENCY_TTL_SECONDS: ${PAYMENT_IDEMPOTENCY_TTL_SECONDS:-86400}
      PAYMENT_IDEMPOTENCY_LOCK_TTL_SECONDS: ${PAYMENT_IDEMPOTENCY_LOCK_TTL_SECONDS:-300}
      POLICY_SERVICE_URL: http://policy:8082
      IAM_SERVICE_URL: http://iam:8081
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (provide a base64-encoded HMAC key in .env)}
      LOG_FORMAT: ecs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  health-record:
    build:
      context: ..
      dockerfile: e-health-insurance-health-record/Dockerfile
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehi_health_record
      SPRING_DATASOURCE_USERNAME: ehi
      SPRING_DATASOURCE_PASSWORD: ehi
      DB_URL: jdbc:postgresql://postgres:5432/ehi_health_record
      DB_USERNAME: ehi
      DB_PASSWORD: ehi
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      IAM_SERVICE_URL: http://iam:8081
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (provide a base64-encoded HMAC key in .env)}
      LOG_FORMAT: ecs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  ai:
    build:
      context: ..
      dockerfile: e-health-insurance-ai/Dockerfile
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehi_ai
      SPRING_DATASOURCE_USERNAME: ehi
      SPRING_DATASOURCE_PASSWORD: ehi
      POLICY_SERVICE_URL: http://policy:8082
      CLAIM_SERVICE_URL: http://claim:8083
      IAM_SERVICE_URL: http://iam:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_CLAIM_EVENTS_ENABLED: ${AI_CLAIM_EVENTS_ENABLED:-true}
      CLAIM_SUBMITTED_TOPIC: ${CLAIM_SUBMITTED_TOPIC:-claim.submitted}
      CLAIM_AI_SCORED_TOPIC: ${CLAIM_AI_SCORED_TOPIC:-claim.ai.scored}
      AI_CLAIM_SUBMITTED_CONSUMER_GROUP: ${AI_CLAIM_SUBMITTED_CONSUMER_GROUP:-ai-service-claim-submitted}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set in .env}
      LLM_MODEL: ${LLM_MODEL:-google/gemini-2.5-flash}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (provide a base64-encoded HMAC key in .env)}
      LOG_FORMAT: ecs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      iam: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  notification:
    build:
      context: ..
      dockerfile: e-health-insurance-notification/Dockerfile
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: ${NOTIFICATION_SPRING_PROFILE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehi_notification
      SPRING_DATASOURCE_USERNAME: ehi
      SPRING_DATASOURCE_PASSWORD: ehi
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_EVENTS_ENABLED: ${NOTIFICATION_EVENTS_ENABLED:-true}
      NOTIFICATION_EMAIL_REQUESTED_TOPIC: ${NOTIFICATION_EMAIL_REQUESTED_TOPIC:-notification.email.requested}
      NOTIFICATION_EMAIL_CONSUMER_GROUP: ${NOTIFICATION_EMAIL_CONSUMER_GROUP:-notification-service-email}
      NOTIFICATION_EMAIL_REQUESTED_DLQ_TOPIC: ${NOTIFICATION_EMAIL_REQUESTED_DLQ_TOPIC:-notification.email.requested.dlq}
      NOTIFICATION_DELIVERY_MAX_ATTEMPTS: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:-3}
      NOTIFICATION_DELIVERY_RETRY_DELAY_MS: ${NOTIFICATION_DELIVERY_RETRY_DELAY_MS:-120000}
      NOTIFICATION_DELIVERY_DLQ_ENABLED: ${NOTIFICATION_DELIVERY_DLQ_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (provide a base64-encoded HMAC key in .env)}
      LOG_FORMAT: ecs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  frontend:
    build:
      context: ../e-health-insurance-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_GATEWAY_URL: http://gateway:8080
    volumes:
      # Mount host source so vite picks up edits live; keep container's
      # node_modules to avoid pulling host's mac-built deps into linux.
      - ../e-health-insurance-frontend/src:/app/src
      - ../e-health-insurance-frontend/index.html:/app/index.html
      - ../e-health-insurance-frontend/public:/app/public
      - ../e-health-insurance-frontend/vite.config.ts:/app/vite.config.ts
      - ../e-health-insurance-frontend/tsconfig.json:/app/tsconfig.json
    depends_on: [gateway]
    profiles: ["frontend"]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  evidence-data:
  loki-data:
  prometheus-data:
  grafana-data:
