apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      # Loki log-undan trace ID çıxarıb Jaeger-də açmaq üçün
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: 'trace[._]id"?[:=]\s*"?([a-f0-9]+)"?'
          name: TraceID
          url: '$${__value.raw}'

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
