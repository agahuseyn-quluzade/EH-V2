databaseChangeLog:
  - changeSet:
      id: 001-create-fraud-checks
      author: ehi
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: fraud_checks
      changes:
        - createTable:
            tableName: fraud_checks
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: claim_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: claim_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: numeric(38,2)
                  constraints:
                    nullable: false
              - column:
                  name: rule_score
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: ai_score
                  type: int
              - column:
                  name: final_score
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: ai_explanation
                  type: varchar(255)
              - column:
                  name: created_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-fraud-check-flags
      author: ehi
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: fraud_check_flags
      changes:
        - createTable:
            tableName: fraud_check_flags
            columns:
              - column:
                  name: fraud_check_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_fraud_check_flags_fraud_check_id
                    references: fraud_checks(id)
              - column:
                  name: flags
                  type: varchar(255)

  - changeSet:
      id: 003-create-chat-messages
      author: ehi
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: chat_messages
      changes:
        - createTable:
            tableName: chat_messages
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: session_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-create-risk-profiles
      author: ehi
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: risk_profiles
      changes:
        - createTable:
            tableName: risk_profiles
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: total_claims
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: average_risk_score
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: high_risk_count
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: last_claim_at
                  type: TIMESTAMP(6) WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-create-policy-coverages
      author: ehi
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: policy_coverages
      changes:
        - createTable:
            tableName: policy_coverages
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: policy_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: coverage_amount
                  type: numeric(38,2)
                  constraints:
                    nullable: false
