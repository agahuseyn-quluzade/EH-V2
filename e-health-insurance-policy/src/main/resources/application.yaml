spring:
  application:
    name: e-health-insurance-policy
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/policy}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: ${KAFKA_PRODUCER_RETRIES:10}
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}
    consumer:
      group-id: ${POLICY_PAYMENT_CONSUMER_GROUP:policy-service-payment-events}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8082}

ehi:
  security:
    jwt:
      secret: ${JWT_SECRET}
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}
      send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:10000}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
      retry-delay-ms: ${OUTBOX_RETRY_DELAY_MS:30000}
      dlq-suffix: ${OUTBOX_DLQ_SUFFIX:.dlq}
  policy:
    payment-events:
      enabled: ${POLICY_PAYMENT_EVENTS_ENABLED:true}
      payment-initiated-topic: ${PAYMENT_INITIATED_TOPIC:payment.initiated}
      payment-succeeded-topic: ${PAYMENT_SUCCEEDED_TOPIC:payment.succeeded}
      payment-failed-topic: ${PAYMENT_FAILED_TOPIC:payment.failed}

iam:
  validation-enabled: ${IAM_VALIDATION_ENABLED:true}
  base-url: ${IAM_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  info:
    env:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://jaeger:4318/v1/traces}
info:
  app:
    name: ${spring.application.name}
    version: 0.0.1-SNAPSHOT

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
