databaseChangeLog:
  - changeSet:
      id: 001-create-notifications
      author: ehi
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: notifications
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: channel
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: recipient
                  type: varchar(255)
              - column:
                  name: subject
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: retry_count
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false
