spring:
  datasource:
    url: jdbc:h2:mem:notification-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false
  mail:
    host: localhost
    port: 1025

ehi:
  security:
    jwt:
      secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctcHVycG9zZXMtb25seQ==
  notification:
    outbox:
      enabled: false
    delivery:
      batch-size: 10
      max-attempts: 2
      retry-delay-ms: 1
      dlq-enabled: true
      dlq-topic: notification.email.requested.dlq
      dlq-send-timeout-ms: 100
    events:
      enabled: false
