server:
  port: ${SERVER_PORT:8085}

ehi:
  security:
    jwt:
      secret: ${JWT_SECRET}
  notification:
    events:
      enabled: ${NOTIFICATION_EVENTS_ENABLED:true}
      email-requested-topic: ${NOTIFICATION_EMAIL_REQUESTED_TOPIC:notification.email.requested}
      email-requested-consumer-group: ${NOTIFICATION_EMAIL_CONSUMER_GROUP:notification-service-email}
      retry-interval-ms: ${NOTIFICATION_EVENT_RETRY_INTERVAL_MS:1000}
      max-retry-attempts: ${NOTIFICATION_EVENT_MAX_RETRY_ATTEMPTS:3}
      dlq-suffix: ${NOTIFICATION_EVENT_DLQ_SUFFIX:.dlq}
    outbox:
      enabled: ${NOTIFICATION_OUTBOX_ENABLED:true}
      fixed-delay-ms: ${NOTIFICATION_OUTBOX_FIXED_DELAY_MS:5000}
    delivery:
      batch-size: ${NOTIFICATION_DELIVERY_BATCH_SIZE:50}
      max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:3}
      retry-delay-ms: ${NOTIFICATION_DELIVERY_RETRY_DELAY_MS:120000}
      dlq-enabled: ${NOTIFICATION_DELIVERY_DLQ_ENABLED:true}
      dlq-topic: ${NOTIFICATION_EMAIL_REQUESTED_DLQ_TOPIC:notification.email.requested.dlq}
      dlq-send-timeout-ms: ${NOTIFICATION_DELIVERY_DLQ_SEND_TIMEOUT_MS:10000}

spring:
  application:
    name: e-health-insurance-notification
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${NOTIFICATION_EMAIL_CONSUMER_GROUP:notification-service-email}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: ${KAFKA_PRODUCER_RETRIES:10}
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  info:
    env:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://jaeger:4318/v1/traces}
info:
  app:
    name: ${spring.application.name}
    version: 0.0.1-SNAPSHOT

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO
    com.eHealthInsurance: INFO
