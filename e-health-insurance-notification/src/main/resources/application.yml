server:
  port: 8086

spring:
  application:
    name: e-health-insurance-notification
  datasource:
    url: jdbc:postgresql://localhost:5432/ehi_notification
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ehi.infra.event
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:85071bbb13fe61a58f2e02f1980865290972d955f35d469f0a52160f922527c7925057cff3cd4af96b9d6fbc84d9b84d82d766d1e59e998482763209574bb4d6}

notification:
  email:
    from: ${MAIL_FROM:no-reply@ehi.example.com}
