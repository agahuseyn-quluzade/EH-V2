databaseChangeLog:
  - changeSet:
      id: create-outbox-event-table
      author: ehealth
      changes:
        - createTable:
            tableName: outbox_event
            columns:
              - column: { name: event_id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: aggregate_type, type: varchar(100), constraints: { nullable: false } }
              - column: { name: aggregate_id, type: uuid, constraints: { nullable: false } }
              - column: { name: event_type, type: varchar(160), constraints: { nullable: false } }
              - column: { name: topic, type: varchar(160), constraints: { nullable: false } }
              - column: { name: payload, type: text, constraints: { nullable: false } }
              - column: { name: status, type: varchar(32), constraints: { nullable: false } }
              - column: { name: retry_count, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: max_attempts, type: int, defaultValueNumeric: 10, constraints: { nullable: false } }
              - column: { name: next_attempt_at, type: timestamp with time zone }
              - column: { name: last_error, type: text }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: sent_at, type: timestamp with time zone }
        - createIndex:
            indexName: idx_outbox_status_next_attempt
            tableName: outbox_event
            columns:
              - column: { name: status }
              - column: { name: next_attempt_at }
        - createIndex:
            indexName: idx_outbox_aggregate
            tableName: outbox_event
            columns:
              - column: { name: aggregate_type }
              - column: { name: aggregate_id }
        - createIndex:
            indexName: idx_outbox_topic
            tableName: outbox_event
            columns:
              - column: { name: topic }
