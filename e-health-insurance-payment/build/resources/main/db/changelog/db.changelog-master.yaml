databaseChangeLog:
  - changeSet:
      id: 001-create-payments
      author: ehi
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: payments
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: reference_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: reference_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: numeric(38,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_id
                  type: varchar(255)
              - column:
                  name: failure_reason
                  type: varchar(255)
              - column:
                  name: created_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-add-epoint-columns
      author: ehi
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: payments
            columnName: epoint_transaction
      changes:
        - addColumn:
            tableName: payments
            columns:
              - column:
                  name: epoint_transaction
                  type: varchar(255)
              - column:
                  name: checkout_url
                  type: varchar(1024)
              - column:
                  name: bank_transaction
                  type: varchar(255)
              - column:
                  name: rrn
                  type: varchar(255)
              - column:
                  name: card_mask
                  type: varchar(255)

  - changeSet:
      id: 003-create-saved-cards
      author: ehi
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: saved_cards
      changes:
        - createTable:
            tableName: saved_cards
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: card_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: card_mask
                  type: varchar(255)
              - column:
                  name: card_name
                  type: varchar(255)
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP(6) WITH TIME ZONE
                  constraints:
                    nullable: false
