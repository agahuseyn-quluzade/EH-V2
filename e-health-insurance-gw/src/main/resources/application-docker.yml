spring:
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://iam:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: users
          uri: http://iam:8081
          predicates:
            - Path=/api/v1/users/**
        - id: plans
          uri: http://policy:8082
          predicates:
            - Path=/api/v1/plans/**
        - id: policies
          uri: http://policy:8082
          predicates:
            - Path=/api/v1/policies/**
        - id: claims
          uri: http://claim:8083
          predicates:
            - Path=/api/v1/claims/**
        - id: payments
          uri: http://payment:8084
          predicates:
            - Path=/api/v1/payments/**
        - id: ai
          uri: http://ai:8085
          predicates:
            - Path=/api/v1/ai/**
        - id: notifications
          uri: http://notification:8086
          predicates:
            - Path=/api/v1/notifications/**
