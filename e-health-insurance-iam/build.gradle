plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.ehi'
version = '0.0.1-SNAPSHOT'
// Override Spring Boot-managed Testcontainers to fix Docker 29.x incompatibility
ext['testcontainers.version'] = '1.20.6'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation libs.infra

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'

    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    runtimeOnly libs.postgresql
    runtimeOnly 'org.liquibase:liquibase-core'

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    annotationProcessor libs.lombok.mapstruct.binding
    implementation libs.mapstruct
    annotationProcessor libs.mapstruct.processor

    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
    exclude('**/*IT.class')
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    include('**/*IT.class')
    group = 'verification'
    description = 'Runs integration tests (requires running Docker Compose Postgres).'
    shouldRunAfter(tasks.named('test'))
}
